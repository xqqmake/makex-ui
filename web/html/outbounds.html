{{define "settings/xray/outbounds"}}
<a-space direction="vertical" size="middle">
    <a-row>
        <a-col :xs="12" :sm="12" :lg="12">
            <a-space direction="horizontal" size="small">
                <a-button type="primary" icon="plus" @click="addOutbound()">
                    {{ i18n "pages.xray.outbound.addOutbound" }}
                </a-button>
                <a-button type="primary" icon="cloud" @click="showWarp()">WARP</a-button>
                <a-button type="primary" icon="import" @click="showImportOutboundModal()">
                    一键导入
                </a-button>
            </a-space>
        </a-col>
        <a-col :xs="12" :sm="12" :lg="12" :style="{ textAlign: 'right' }">
            <a-button-group>
                <a-button icon="sync" @click="refreshOutboundTraffic()" :loading="refreshing"></a-button>
                <a-popconfirm placement="topRight" @confirm="resetOutboundTraffic(-1)"
                    title='{{ i18n "pages.inbounds.resetTrafficContent"}}'
                    :overlay-class-name="themeSwitcher.currentTheme" ok-text='{{ i18n "reset"}}'
                    cancel-text='{{ i18n "cancel"}}'>
                    <a-icon slot="icon" type="question-circle-o"
                        :style="{ color: themeSwitcher.isDarkTheme ? '#008771' : '#008771' }"></a-icon>
                    <a-button icon="retweet"></a-button>
                </a-popconfirm>
            </a-button-group>
        </a-col>
    </a-row>
    <a-modal v-model="importOutboundModal.visible" :title="importOutboundModal.title"
        :confirm-loading="importOutboundModal.loading" ok-text="导入" cancel-text='{{ i18n "cancel" }}'
        @ok="doImportOutbound()" :class="themeSwitcher.currentTheme">
        <p :style="{ margin: '0 0 8px 0', fontSize: '13px', color: '#888' }">
            粘贴 vless:// vmess:// trojan:// ss:// 分享链接，每行一个，自动解析创建出站节点
        </p>
        <a-input type="textarea" v-model="importOutboundModal.links" :rows="8"
            placeholder="vless://uuid@host:port?..."></a-input>
        <div v-if="importOutboundModal.result" :style="{ marginTop: '10px' }">
            <a-alert :type="importOutboundModal.result.success ? 'success' : 'warning'" show-icon>
                <template slot="message">
                    <div>成功 [[ importOutboundModal.result.created.length ]] 个</div>
                    <div v-for="item in importOutboundModal.result.created">[[ item.protocol ]] / [[ item.address ]]:[[ item.port ]] → [[ item.tag ]]</div>
                    <div v-if="importOutboundModal.result.failed.length > 0" :style="{ marginTop: '6px', color: '#cf1322' }">
                        失败 [[ importOutboundModal.result.failed.length ]] 个：<br />
                        <div v-for="f in importOutboundModal.result.failed" :style="{ fontSize: '12px' }">[[ f ]]</div>
                    </div>
                </template>
            </a-alert>
        </div>
    </a-modal>
    <a-table :columns="outboundColumns" bordered :row-key="r => r.key" :data-source="outboundData"
        :scroll="isMobile ? {} : { x: 650 }" :pagination="false" :indent-size="0"
        :locale='{ filterConfirm: `{{ i18n "confirm" }}`, filterReset: `{{ i18n "reset" }}` }'>
        <template slot="action" slot-scope="text, outbound, index">
            <span>[[ index+1 ]]</span>
            <a-dropdown :trigger="['click']">
                <a-icon @click="e => e.preventDefault()" type="more"
                    :style="{ fontSize: '16px', textDecoration: 'bold' }"></a-icon>
                <a-menu slot="overlay" :theme="themeSwitcher.currentTheme">
                    <a-menu-item v-if="index>0" @click="setFirstOutbound(index)">
                        <a-icon type="vertical-align-top"></a-icon>
                        <span>{{ i18n "pages.xray.rules.first"}}</span>
                    </a-menu-item>
                    <a-menu-item @click="editOutbound(index)">
                        <a-icon type="edit"></a-icon>
                        <span>{{ i18n "edit" }}</span>
                    </a-menu-item>
                    <a-menu-item @click="resetOutboundTraffic(index)">
                        <span>
                            <a-icon type="retweet"></a-icon>
                            <span>{{ i18n "pages.inbounds.resetTraffic"}}</span>
                        </span>
                    </a-menu-item>
                    <a-menu-item @click="deleteOutbound(index)">
                        <span :style="{ color: '#FF4D4F' }">
                            <a-icon type="delete"></a-icon>
                            <span>{{ i18n "delete"}}</span>
                        </span>
                    </a-menu-item>
                </a-menu>
            </a-dropdown>
        </template>
        <template slot="address" slot-scope="text, outbound, index">
            <p :style="{ margin: '0 5px' }" v-for="addr in findOutboundAddress(outbound)">[[ addr ]]</p>
        </template>
        <template slot="protocol" slot-scope="text, outbound, index">
            <a-tag :style="{ margin: '0' }" color="purple">[[ outbound.protocol ]]</a-tag>
            <template
                v-if="[Protocols.VMess, Protocols.VLESS, Protocols.Trojan, Protocols.Shadowsocks].includes(outbound.protocol)">
                <a-tag :style="{ margin: '0' }" color="blue">[[ outbound.streamSettings.network ]]</a-tag>
                <a-tag :style="{ margin: '0' }" v-if="outbound.streamSettings.security=='tls'" color="green">tls</a-tag>
                <a-tag :style="{ margin: '0' }" v-if="outbound.streamSettings.security=='reality'"
                    color="green">reality</a-tag>
            </template>
        </template>
        <template slot="traffic" slot-scope="text, outbound, index">
            <a-tag color="green">[[ findOutboundTraffic(outbound) ]]</a-tag>
        </template>
        <template slot="test" slot-scope="text, outbound, index">
            <a-space size="small">
                <a-tooltip title="测试出站连通性">
                    <a-button size="small" shape="circle"
                        :loading="testingTag === outbound.tag"
                        :icon="testingTag === outbound.tag ? '' : 'thunderbolt'"
                        :style="{ borderColor: outboundTestResult && outboundTestResult.tag === outbound.tag ? (outboundTestResult.success ? '#52c41a' : '#ff4d4f') : '#d9d9d9', color: outboundTestResult && outboundTestResult.tag === outbound.tag && outboundTestResult.success ? '#52c41a' : '' }"
                        @click="testOutbound(outbound)"></a-button>
                </a-tooltip>
                <span v-if="outboundTestResult && outboundTestResult.tag === outbound.tag">
                    <a-tooltip :title="outboundTestResult.success ? ('延迟 ' + outboundTestResult.latency + 'ms') : outboundTestResult.error">
                        <span :style="{ color: '#fff', background: outboundTestResult.success ? '#389e0d' : '#cf1322', borderRadius: '3px', padding: '0 6px', fontSize: '12px', lineHeight: '18px', display: 'inline-block', whiteSpace: 'nowrap' }">
                            [[ outboundTestResult.success ? outboundTestResult.latency + 'ms' : '失败' ]]
                        </span>
                    </a-tooltip>
                </span>
            </a-space>
        </template>
    </a-table>
</a-space>
{{end}}
