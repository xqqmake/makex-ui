{{define "form/streamSettings"}}
<!-- select stream network -->
<a-form :colon="false" :label-col="{ md: {span:8} }"
    :wrapper-col="{ md: {span:14} }">
    <a-form-item label='{{ i18n "transmission" }}' v-if="!inbound.isSingBoxProtocol()">
        <a-select v-model="inbound.stream.network" :style="{ width: '75%' }"
            @change="streamNetworkChange"
            :dropdown-class-name="themeSwitcher.currentTheme">
            <a-select-option value="tcp">TCP (RAW)</a-select-option>
            <a-select-option value="kcp">mKCP</a-select-option>
            <a-select-option value="ws">WebSocket</a-select-option>
            <a-select-option value="grpc">gRPC</a-select-option>
            <a-select-option value="httpupgrade">HTTPUpgrade</a-select-option>
            <a-select-option value="xhttp">XHTTP</a-select-option>
            <a-select-option value="hysteria">Hysteria</a-select-option>
        </a-select>
    </a-form-item>
    <a-form-item v-else label='{{ i18n "transmission" }}'>
        <a-input disabled :value="inbound.protocol + ' (sing-box 内核，无传输层包装)'"></a-input>
    </a-form-item>
</a-form>

<!-- tcp -->
<template v-if="inbound.stream.network === 'tcp'">
    {{template "form/streamTCP"}}
</template>

<!-- kcp -->
<template v-if="inbound.stream.network === 'kcp'">
    {{template "form/streamKCP"}}
</template>

<!-- ws -->
<template v-if="inbound.stream.network === 'ws'">
    {{template "form/streamWS"}}
</template>

<!-- Argo 隧道 (cloudflared quick tunnel, 仅 vmess/vless + ws 传输) -->
<template
    v-if="inbound.stream.network === 'ws' && (inbound.protocol === Protocols.VMESS || inbound.protocol === Protocols.VLESS)">
    <a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
        <a-form-item label="Argo 隧道 (Cloudflare)">
            <a-switch v-model="inbound.stream.argo.enabled" checked-children="开" un-checked-children="关"></a-switch>
            <div v-if="inbound.stream.argo.enabled" style="margin-top:6px;color:#888;font-size:12px;">
                {{ i18n "pages.inbounds.argoHint" }}
            </div>
        </a-form-item>
    </a-form>
</template>

<!-- grpc -->
<template v-if="inbound.stream.network === 'grpc'">
    {{template "form/streamGRPC"}}
</template>

<!-- httpupgrade -->
<template v-if="inbound.stream.network === 'httpupgrade'">
    {{template "form/streamHTTPUpgrade"}}
</template>

<!-- xhttp -->
<template v-if="inbound.stream.network === 'xhttp'">
    {{template "form/streamXHTTP"}}
</template>

<template v-if="inbound.stream.network === 'hysteria'">
    {{template "form/streamHysteria"}}
</template>

<!-- sockopt -->
<template>
    {{template "form/streamSockopt"}}
</template>

<!-- finalmask - only for TCP, WS, HTTPUpgrade, XHTTP, mKCP -->
<template
    v-if="['tcp', 'ws', 'httpupgrade', 'xhttp', 'kcp'].includes(inbound.stream.network)">
    {{template "form/streamFinalMask"}}
</template>
{{end}}
