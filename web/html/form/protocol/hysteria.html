{{define "form/hysteria"}}
<a-collapse activeKey="0" v-for="(client, index) in inbound.settings.clients.slice(0,1)" v-if="!isEdit">
    <a-collapse-panel header='{{ i18n "pages.inbounds.client" }}'>
        {{template "form/client" .}}
    </a-collapse-panel>
</a-collapse>
<a-collapse v-else>
    <a-collapse-panel :header="'{{ i18n "pages.client.clientCount"}} : ' +
        inbound.settings.clients.length">
        <table width="100%">
            <tr class="client-table-header">
                <th>{{ i18n "pages.inbounds.email" }}</th>
                <th>Auth</th>
            </tr>
            <tr v-for="(client, index) in inbound.settings.clients"
                :class="index % 2 == 1 ? 'client-table-odd-row' : ''">
                <td>[[ client.email ]]</td>
                <td>[[ client.auth ]]</td>
            </tr>
        </table>
    </a-collapse-panel>
</a-collapse>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
    <a-form-item label="Version">
        <a-input-number v-model.number="inbound.settings.version" :min="1" :max="2" disabled></a-input-number>
    </a-form-item>
    <a-form-item label="认证(auth)">
        <a-input-group compact style="display: flex; width: 420px;">
            <a-input v-model.trim="inbound.settings.clients[0].auth" style="width: 75%"></a-input>
            <a-button size="small" style="width: 25%" @click="inbound.settings.clients[0].refreshAuth()">
                更换
            </a-button>
        </a-input-group>
    </a-form-item>
</a-form>
{{end}}
