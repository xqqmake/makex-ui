{{define "form/tuic"}}
<a-collapse activeKey="0" v-for="(client, index) in inbound.settings.clients.slice(0,1)" v-if="!isEdit">
  <a-collapse-panel header='{{ i18n "pages.inbounds.client" }}'>
    {{template "form/client"}}
  </a-collapse-panel>
</a-collapse>
<a-collapse v-else>
  <a-collapse-panel :header="'{{ i18n "pages.client.clientCount"}} : ' + inbound.settings.clients.length">
    <table width="100%">
      <tr class="client-table-header">
        <th>{{ i18n "pages.inbounds.email" }}</th>
        <th>ID</th>
      </tr>
      <tr v-for="(client, index) in inbound.settings.clients" :class="index % 2 == 1 ? 'client-table-odd-row' : ''">
        <td>[[ client.email ]]</td>
        <td>[[ client.id ]]</td>
      </tr>
    </table>
  </a-collapse-panel>
</a-collapse>
<a-divider :style="{ margin: '5px 0' }"></a-divider>
<a-form :colon="false" :label-col="{ md: {span:8} }" :wrapper-col="{ md: {span:14} }">
  <a-form-item label="Congestion Control">
    <a-select v-model="inbound.settings.congestionControl" :dropdown-class-name="themeSwitcher.currentTheme">
      <a-select-option value="bbr">BBR (默认)</a-select-option>
      <a-select-option value="cubic">CUBIC</a-select-option>
      <a-select-option value="new_reno">New Reno</a-select-option>
    </a-select>
  </a-form-item>
  <a-form-item label="UDP Relay Mode">
    <a-select v-model="inbound.settings.udpRelayMode" :dropdown-class-name="themeSwitcher.currentTheme">
      <a-select-option value="native">Native</a-select-option>
      <a-select-option value="quic">QUIC</a-select-option>
    </a-select>
  </a-form-item>
</a-form>
{{end}}
