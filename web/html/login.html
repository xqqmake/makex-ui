{{ template "page/head_start" .}}
<style>
  /* 动态网络背景：深色底 + 粒子连线网络（网络元素风） */
  body {
    background: #0a1c33;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  #net-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 1;
  }

  #app {
    position: relative;
    z-index: 1;
  }

  html * {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  h1 {
    text-align: center;
    /*margin: 20px 0 50px 0;*/
    height: 110px;
  }

  .ant-form-item-children .ant-btn,
  .ant-input {
    height: 50px;
    border-radius: 30px;
  }

  .ant-input-group-addon {
    border-radius: 0 30px 30px 0;
    width: 50px;
    font-size: 18px;
  }

  .ant-input-affix-wrapper .ant-input-prefix {
    left: 23px;
  }

  .ant-input-affix-wrapper .ant-input:not(:first-child) {
    padding-left: 50px;
  }

  .centered {
    display: flex;
    text-align: center;
    align-items: center;
    justify-content: center;
    width: 100%;
  }

  .title {
    font-size: 2rem;
    margin-block-end: 2rem;
  }

  .title b {
    font-weight: bold !important;
  }

  #app {
    overflow: hidden;
  }

  #login {
    animation: charge 0.5s both;
    background-color: #fff;
    border-radius: 2rem;
    padding: 4rem 3rem;
    transition: all 0.3s;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
  }

  #login:hover {
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.09);
  }

  @keyframes charge {
    from {
      transform: translateY(5rem);
      opacity: 0;
    }

    to {
      transform: translateY(0);
      opacity: 1;
    }
  }

  .under {
    background-color: #c7ebe2;
    z-index: 0;
  }

  .dark .under {
    background-color: var(--dark-color-login-wave);
  }

  .dark #login {
    background-color: var(--dark-color-surface-100);
  }

  .dark h1 {
    color: rgba(255, 255, 255);
  }

  .ant-btn-primary-login {
    width: 100%;
  }

  .ant-btn-primary-login:focus,
  .ant-btn-primary-login:hover {
    color: #fff;
    background-color: #006655;
    border-color: #006655;
    background-image: linear-gradient(270deg,
        rgba(123, 199, 77, 0) 30%,
        #009980,
        rgba(123, 199, 77, 0) 100%);
    background-repeat: no-repeat;
    animation: ma-bg-move ease-in-out 5s infinite;
    background-position-x: -500px;
    width: 95%;
    animation-delay: -0.5s;
    box-shadow: 0 2px 0 rgba(0, 0, 0, 0.045);
  }

  .ant-btn-primary-login.active,
  .ant-btn-primary-login:active {
    color: #fff;
    background-color: #006655;
    border-color: #006655;
  }

  @keyframes ma-bg-move {
    0% {
      background-position: -500px 0;
    }

    50% {
      background-position: 1000px 0;
    }

    100% {
      background-position: 1000px 0;
    }
  }

  .wave-btn-bg {
    position: relative;
    border-radius: 25px;
    width: 100%;
    transition: all 0.3s cubic-bezier(.645, .045, .355, 1);
  }

  .dark .wave-btn-bg {
    color: #fff;
    position: relative;
    background-color: #0a7557;
    border: 2px double transparent;
    background-origin: border-box;
    background-clip: padding-box, border-box;
    background-size: 300%;
    width: 100%;
    z-index: 1;
  }

  .dark .wave-btn-bg:hover {
    animation: wave-btn-tara 4s ease infinite;
  }

  .dark .wave-btn-bg-cl {
    background-image: linear-gradient(rgba(13, 14, 33, 0), rgba(13, 14, 33, 0)),
      radial-gradient(circle at left top, #006655, #009980, #006655) !important;
    border-radius: 3em;
  }

  .dark .wave-btn-bg-cl:hover {
    width: 95%;
  }

  .dark .wave-btn-bg-cl:before {
    position: absolute;
    content: "";
    top: -5px;
    left: -5px;
    bottom: -5px;
    right: -5px;
    z-index: -1;
    background: inherit;
    background-size: inherit;
    border-radius: 4em;
    opacity: 0;
    transition: 0.5s;
  }

  .dark .wave-btn-bg-cl:hover::before {
    opacity: 1;
    filter: blur(20px);
    animation: wave-btn-tara 8s linear infinite;
  }

  @keyframes wave-btn-tara {
    to {
      background-position: 300%;
    }
  }

  .dark .ant-btn-primary-login {
    font-size: 14px;
    color: #fff;
    text-align: center;
    background-image: linear-gradient(rgba(13, 14, 33, 0.45),
        rgba(13, 14, 33, 0.35));
    border-radius: 2rem;
    border: none;
    outline: none;
    background-color: transparent;
    height: 46px;
    position: relative;
    white-space: nowrap;
    cursor: pointer;
    touch-action: manipulation;
    padding: 0 15px;
    width: 100%;
    animation: none;
    background-position-x: 0;
    box-shadow: none;
  }

  .waves-header {
    position: fixed;
    width: 100%;
    text-align: center;
    background-color: #dbf5ed;
    color: white;
    z-index: -1;
  }

  .dark .waves-header {
    background-color: var(--dark-color-login-background);
  }

  .waves-inner-header {
    height: 50vh;
    width: 100%;
    margin: 0;
    padding: 0;
  }

  .waves {
    position: relative;
    width: 100%;
    height: 15vh;
    margin-bottom: -8px;
    /*Fix for safari gap*/
    min-height: 100px;
    max-height: 150px;
  }

  .parallax>use {
    animation: move-forever 25s cubic-bezier(0.55, 0.5, 0.45, 0.5) infinite;
  }

  .dark .parallax>use {
    fill: var(--dark-color-login-wave);
  }

  .parallax>use:nth-child(1) {
    animation-delay: -2s;
    animation-duration: 4s;
    opacity: 0.2;
  }

  .parallax>use:nth-child(2) {
    animation-delay: -3s;
    animation-duration: 7s;
    opacity: 0.4;
  }

  .parallax>use:nth-child(3) {
    animation-delay: -4s;
    animation-duration: 10s;
    opacity: 0.6;
  }

  .parallax>use:nth-child(4) {
    animation-delay: -5s;
    animation-duration: 13s;
  }

  @keyframes move-forever {
    0% {
      transform: translate3d(-90px, 0, 0);
    }

    100% {
      transform: translate3d(85px, 0, 0);
    }
  }

  @media (max-width: 768px) {
    .waves {
      height: 40px;
      min-height: 40px;
    }
  }

  .words-wrapper {
    width: 100%;
    display: inline-block;
    position: relative;
    text-align: center;
  }

  .words-wrapper b {
    width: 100%;
    display: inline-block;
    position: absolute;
    left: 0;
    top: 0;
  }

  .words-wrapper b.is-visible {
    position: relative;
  }

  .headline.zoom .words-wrapper {
    -webkit-perspective: 300px;
    -moz-perspective: 300px;
    perspective: 300px;
  }

  .headline {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .headline.zoom b {
    opacity: 0;
  }

  .headline.zoom b.is-visible {
    opacity: 1;
    -webkit-animation: zoom-in 0.8s;
    -moz-animation: zoom-in 0.8s;
    animation: cubic-bezier(0.215, 0.610, 0.355, 1.000) zoom-in 0.8s;
  }

  .headline.zoom b.is-hidden {
    -webkit-animation: zoom-out 0.8s;
    -moz-animation: zoom-out 0.8s;
    animation: cubic-bezier(0.215, 0.610, 0.355, 1.000) zoom-out 0.4s;
  }

  @-webkit-keyframes zoom-in {
    0% {
      opacity: 0;
      -webkit-transform: translateZ(100px);
    }

    100% {
      opacity: 1;
      -webkit-transform: translateZ(0);
    }
  }

  @-moz-keyframes zoom-in {
    0% {
      opacity: 0;
      -moz-transform: translateZ(100px);
    }

    100% {
      opacity: 1;
      -moz-transform: translateZ(0);
    }
  }

  @keyframes zoom-in {
    0% {
      opacity: 0;
      -webkit-transform: translateZ(100px);
      -moz-transform: translateZ(100px);
      -ms-transform: translateZ(100px);
      -o-transform: translateZ(100px);
      transform: translateZ(100px);
    }

    100% {
      opacity: 1;
      -webkit-transform: translateZ(0);
      -moz-transform: translateZ(0);
      -ms-transform: translateZ(0);
      -o-transform: translateZ(0);
      transform: translateZ(0);
    }
  }

  @-webkit-keyframes zoom-out {
    0% {
      opacity: 1;
      -webkit-transform: translateZ(0);
    }

    100% {
      opacity: 0;
      -webkit-transform: translateZ(-100px);
    }
  }

  @-moz-keyframes zoom-out {
    0% {
      opacity: 1;
      -moz-transform: translateZ(0);
    }

    100% {
      opacity: 0;
      -moz-transform: translateZ(-100px);
    }
  }

  @keyframes zoom-out {
    0% {
      opacity: 1;
      -webkit-transform: translateZ(0);
      -moz-transform: translateZ(0);
      -ms-transform: translateZ(0);
      -o-transform: translateZ(0);
      transform: translateZ(0);
    }

    100% {
      opacity: 0;
      -webkit-transform: translateZ(-100px);
      -moz-transform: translateZ(-100px);
      -ms-transform: translateZ(-100px);
      -o-transform: translateZ(-100px);
      transform: translateZ(-100px);
    }
  }

  .setting-section {
    position: absolute;
    top: 0;
    right: 0;
    padding: 22px;
  }

  .ant-space-item .ant-switch {
    margin: 2px 0 4px;
  }
</style>

<a-layout id="app" v-cloak :class="themeSwitcher.currentTheme">
  <transition name="list" appear>
    <a-layout-content class="under" :style="{ minHeight: '0' }">
      <div class="waves-header">
        <div class="waves-inner-header"></div>
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
          viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
          <defs>
            <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
          </defs>
          <g class="parallax">
            <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(0, 135, 113, 0.08)" />
            <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(0, 135, 113, 0.08)" />
            <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(0, 135, 113, 0.08)" />
            <use xlink:href="#gentle-wave" x="48" y="7" fill="#c7ebe2" />

        </svg>
      </div>

        <a-col :xs="22" :sm="12" :md="10" :lg="8" :xl="6" :xxl="5" id="login" :style="{ margin: '3rem 0' }">
          <template v-if="!loadingStates.fetched">
            <div :style="{ textAlign: 'center' }">
              <a-spin size="large" />
            </div>
          </template>
          <template v-else>
            <div class="setting-section">
              <a-popover :overlay-class-name="themeSwitcher.currentTheme" title='{{ i18n "menu.settings" }}'
                placement="bottomRight" trigger="click">
                <template slot="content">
                  <a-space direction="vertical" :size="10">
                    <a-theme-switch-login></a-theme-switch-login>
                    <span>{{ i18n "pages.settings.language" }}</span>
                    <a-select ref="selectLang" :style="{ width: '100%' }" v-model="lang"
                      @change="LanguageManager.setLanguage(lang)" :dropdown-class-name="themeSwitcher.currentTheme">
                      <a-select-option :value="l.value" label="English" v-for="l in LanguageManager.supportedLanguages">
                        <span role="img" aria-label="l.name" v-text="l.icon"></span>
                        &nbsp;&nbsp;<span v-text="l.name"></span>
                      </a-select-option>
                    </a-select>
                  </a-space>
                </template>
                <a-button shape="circle" icon="setting"></a-button>
              </a-popover>
            </div>
            <a-row type="flex" justify="center">
              <a-col :style="{ width: '100%' }">
                <h2 class="title headline zoom">
                  <span class="words-wrapper">
                    <!-- 第一帧：上下两行组成整体 -->
                    <b class="is-visible">
                    <div>〔makex-ui〕</div>
                    <div>{{ i18n "pages.login.XPanelSystem" }}</div>
                    </b>
                    <!-- 第二帧：单独一行 -->
                    <b>
                    <div>{{ i18n "pages.login.title" }}</div>
                    </b>
                  </span>
                </h2>
              </a-col>
            </a-row>
            <a-row type="flex" justify="center">
              <a-col span="24">
                <a-form @submit.prevent="login">
                  <a-space direction="vertical" size="middle">
                    <a-form-item>
                      <a-input autocomplete="username" name="username" v-model.trim="user.username"
                        placeholder='{{ i18n "username" }}' autofocus required>
                        <a-icon slot="prefix" type="user" :style="{ fontSize: '1rem' }"></a-icon>
                      </a-input>
                    </a-form-item>
                    <a-form-item>
                      <a-input-password autocomplete="password" name="password" v-model.trim="user.password"
                        placeholder='{{ i18n "password" }}' required>
                        <a-icon slot="prefix" type="lock" :style="{ fontSize: '1rem' }"></a-icon>
                      </a-input-password>
                    </a-form-item>
                    <a-form-item v-if="twoFactorEnable">
                      <a-input autocomplete="one-time-code" name="twoFactorCode" v-model.trim="user.twoFactorCode"
                        placeholder='{{ i18n "twoFactorCode" }}' required>
                        <a-icon slot="prefix" type="key" :style="{ fontSize: '1rem' }"></a-icon>
                      </a-input>
                    </a-form-item>
                    <a-form-item>
                      <a-row justify="center" class="centered">
                        <div
                          :style="{ height: '50px', marginTop: '1rem', ...loadingStates.spinning ? { width: '52px' } : { display: 'inline-block' } }"
                          class="wave-btn-bg wave-btn-bg-cl">
                          <a-button class="ant-btn-primary-login" type="primary" :loading="loadingStates.spinning"
                            :icon="loadingStates.spinning ? 'poweroff' : undefined" html-type="submit">
                            [[ loadingStates.spinning ? '' : '{{ i18n "login" }}' ]]
                          </a-button>
                        </div>
                      </a-row>
                    </a-form-item>
                  </a-space>
                </a-form>
              </a-col>
            </a-row>
          </template>
        </a-col>
      </a-row>
    </a-layout-content>
  </transition>
</a-layout>

<script>
  const app = new Vue({
    delimiters: ['[[', ']]'],
    el: '#app',
    data: {
      themeSwitcher,
      loadingStates: {
        fetched: false,
        spinning: false
      },
      user: {
        username: "",
        password: "",
        twoFactorCode: ""
      },
      twoFactorEnable: false,
      lang: ""
    },
    async mounted() {
      this.lang = LanguageManager.getLanguage();
      this.twoFactorEnable = await this.getTwoFactorEnable();
    },
    methods: {
      async login() {
        this.loadingStates.spinning = true;

        const msg = await HttpUtil.post('/login', this.user);

        if (msg.success) {
          location.href = basePath + 'panel/';
        }

        this.loadingStates.spinning = false;
      },
      async getTwoFactorEnable() {
        const msg = await HttpUtil.post('/getTwoFactorEnable');

        if (msg.success) {
          this.twoFactorEnable = msg.obj;
          this.loadingStates.fetched = true;

          return msg.obj;
        }
      },
    },
  });

  document.addEventListener("DOMContentLoaded", function () {
    var animationDelay = 2000;
    initHeadline();

    function initHeadline() {
      animateHeadline(document.querySelectorAll('.headline'));
    }

    function animateHeadline(headlines) {
      var duration = animationDelay;
      headlines.forEach(function (headline) {
        setTimeout(function () {
          hideWord(headline.querySelector('.is-visible'));
        }, duration);
      });
    }

    function hideWord(word) {
      var nextWord = takeNext(word);
      switchWord(word, nextWord);
      setTimeout(function () {
        hideWord(nextWord);
      }, animationDelay);
    }

    function takeNext(word) {
      return word.nextElementSibling ? word.nextElementSibling : word.parentElement.firstElementChild;
    }

    function switchWord(oldWord, newWord) {
      oldWord.classList.remove('is-visible');
      oldWord.classList.add('is-hidden');
      newWord.classList.remove('is-hidden');
      newWord.classList.add('is-visible');
    }
  });
</script>

    (function () {
        var canvas = document.getElementById('net-bg');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var W = 0, H = 0;
        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        function P(lon, lat) { return [(lon + 180) / 360 * W, (90 - lat) / 180 * H]; }

        /* 被攻击目标（服务器所在城市） */
        var TARGETS = [ [104.0, 35.0], [-97.5, 37.5], [13.4, 52.5] ];
        /* 全球攻击源 */
        var SOURCES = [ [-60, -12], [35, 28], [120, -25], [-122, 47], [30, 2], [75, 42], [139, 35], [-46, -23], [18, 33], [105, 38], [-70, 20], [12, 56] ];

        var arcs = [];
        function spawn() {
            var s = SOURCES[(Math.random() * SOURCES.length) | 0];
            var t = TARGETS[(Math.random() * TARGETS.length) | 0];
            var p1 = P(s[0], s[1]), p2 = P(t[0], t[1]);
            var mx = (p1[0] + p2[0]) / 2, my = (p1[1] + p2[1]) / 2;
            var d = Math.sqrt((p2[0]-p1[0])*(p2[0]-p1[0]) + (p2[1]-p1[1])*(p2[1]-p1[1]));
            arcs.push({ p1: p1, p2: p2, c: [mx, my - d * 0.28], t: 0, sp: 0.0016 + Math.random() * 0.0028 });
        }
        function bez(p1, c, p2, t) {
            var u = 1 - t;
            return [u*u*p1[0]+2*u*t*c[0]+t*t*p2[0], u*u*p1[1]+2*u*t*c[1]+t*t*p2[1]];
        }

        function frame() {
            var g = ctx.createLinearGradient(0, 0, 0, H);
            g.addColorStop(0, '#0e2442');
            g.addColorStop(0.6, '#123157');
            g.addColorStop(1, '#0a1e3a');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);

            ctx.strokeStyle = 'rgba(70, 160, 220, 0.14)';
            ctx.lineWidth = 0.6;
            ctx.beginPath();
            for (var gx = 0; gx <= W; gx += 80) { ctx.moveTo(gx, 0); ctx.lineTo(gx, H); }
            for (var gy = 0; gy <= H; gy += 80) { ctx.moveTo(0, gy); ctx.lineTo(W, gy); }
            ctx.stroke();

            ctx.strokeStyle = 'rgba(90, 200, 255, 0.65)';
            ctx.lineWidth = 1.3;
            ctx.beginPath();
            for (var r = 0; r < WORLD_LAND.length; r++) {
                var ring = WORLD_LAND[r];
                var f = P(ring[0][0], ring[0][1]);
                ctx.moveTo(f[0], f[1]);
                for (var k = 1; k < ring.length; k++) {
                    var pt = P(ring[k][0], ring[k][1]);
                    ctx.lineTo(pt[0], pt[1]);
                }
            }
            ctx.stroke();

            for (var i = arcs.length - 1; i >= 0; i--) {
                var a = arcs[i];
                a.t += a.sp;
                ctx.strokeStyle = 'rgba(0, 210, 255, 0.42)';
                ctx.lineWidth = 1.3;
                ctx.beginPath();
                for (var s = 0; s <= 24; s++) {
                    var bp = bez(a.p1, a.c, a.p2, s / 24);
                    if (s === 0) ctx.moveTo(bp[0], bp[1]); else ctx.lineTo(bp[0], bp[1]);
                }
                ctx.stroke();
                var hp = bez(a.p1, a.c, a.p2, Math.min(a.t, 1));
                var tp = bez(a.p1, a.c, a.p2, Math.max(0, a.t - 0.10));
                var gr = ctx.createLinearGradient(tp[0], tp[1], hp[0], hp[1]);
                gr.addColorStop(0, 'rgba(0, 230, 255, 0)');
                gr.addColorStop(1, 'rgba(140, 245, 255, 1)');
                ctx.strokeStyle = gr;
                ctx.lineWidth = 2.2;
                ctx.beginPath();
                ctx.moveTo(tp[0], tp[1]); ctx.lineTo(hp[0], hp[1]);
                ctx.stroke();
                if (a.t >= 1) { arcs.splice(i, 1); spawn(); }
            }

            for (var m = 0; m < SOURCES.length; m++) {
                var sp2 = P(SOURCES[m][0], SOURCES[m][1]);
                ctx.beginPath();
                ctx.arc(sp2[0], sp2[1], 3, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 235, 255, 0.95)';
                ctx.fill();
            }

            var now = Date.now();
            for (var j = 0; j < TARGETS.length; j++) {
                var tp2 = P(TARGETS[j][0], TARGETS[j][1]);
                var pulse = (now / 300) % 1;
                ctx.beginPath();
                ctx.arc(tp2[0], tp2[1], 3 + pulse * 18, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 100, 80, ' + (0.7 * (1 - pulse)) + ')';
                ctx.lineWidth = 1.6;
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(tp2[0], tp2[1], 4.2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255, 90, 70, 0.95)';
                ctx.fill();
            }

            requestAnimationFrame(frame);
        }
        for (var i = 0; i < 20; i++) spawn();
        frame();
    })();
